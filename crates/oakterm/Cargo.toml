[package]
name = "oakterm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GPU-accelerated terminal emulator"

[dependencies]
accesskit = { workspace = true }
accesskit_winit = { workspace = true }
arboard = { workspace = true }
chrono = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
oakterm-a11y = { path = "../oakterm-a11y" }
oakterm-config = { path = "../oakterm-config" }
oakterm-protocol = { path = "../oakterm-protocol" }
oakterm-renderer = { path = "../oakterm-renderer" }
oakterm-terminal = { path = "../oakterm-terminal" }
pollster = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-quartz-core = { workspace = true }
objc2-core-graphics = { workspace = true }

[build-dependencies]
vergen = { workspace = true }
vergen-gitcl = { workspace = true }

[lints]
workspace = true

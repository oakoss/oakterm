[workspace]
resolver = "2"
members = [
  "crates/oakterm",
  "crates/oakterm-a11y",
  "crates/oakterm-common",
  "crates/oakterm-config",
  "crates/oakterm-ctl",
  "crates/oakterm-daemon",
  "crates/oakterm-mux",
  "crates/oakterm-protocol",
  "crates/oakterm-pty",
  "crates/oakterm-renderer",
  "crates/oakterm-terminal",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/oakoss/oakterm"
rust-version = "1.85"

[workspace.dependencies]
# Clipboard
arboard = "3.6.1"

# GPU rendering
wgpu = "29.0.4"

# macOS color space (Display P3)
objc2 = "0.6.4"
objc2-core-graphics = { version = "0.3.2", features = ["CGColorSpace"] }
objc2-quartz-core = { version = "0.3.2", features = [
  "CAMetalLayer",
  "objc2-core-graphics",
] }

# Windowing
winit = "0.30.13"

# Status bar clock (local wall time)
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

# Accessibility
accesskit = "0.24.1"
accesskit_winit = "0.33.2"

# Lua config
gethostname = "1.1.0"
mlua = { version = "0.12.0", features = ["lua54", "vendored", "send"] }
strsim = "0.11.1"

# Async runtime
bytes = "1.12.1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }

# Structured logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Wire protocol
prost = "0.14.4"

# Serialization
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Scroll buffer archive
ring = "0.17.14"
zstd = "0.13.3"

# Atlas cache
lru = "0.18.2"

# Font loading and rasterization
bytemuck = { version = "1.25.2", features = ["derive"] }
etagere = "0.3.0"
fontdb = "0.24.0"
swash = "0.2.10"
ttf-parser = "0.25.1"

# Config hot-reload
notify = "8.2.0"
notify-debouncer-full = "0.7.0"

# Benchmarks
criterion = "0.8.2"
pollster = "0.4"

# PTY
libc = "0.2.189"
rustix = { version = "1.1.4", features = [
  "pty",
  "termios",
  "process",
  "fs",
  "stdio",
] }

# Shell-style argument splitting
shlex = "2.0.1"

# Search
regex = "1.13.1"

# VT parser
vte = { version = "0.15.0", features = ["ansi"] }

# Build metadata
vergen = { version = "9.1.0", features = ["build", "cargo"] }
vergen-gitcl = { version = "9.1.0", features = ["build", "cargo"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

output:
  - failure
  - execution_out
  # Without this, a glob matching nothing looks identical to a check that passed.
  - skips

pre-commit:
  # One writer per file type (rustfmt owns .rs, rumdl owns .md, dprint the
  # rest), so parallel is safe.
  parallel: true
  commands:
    cargo-fmt:
      # Lefthook globs have no path separator: '*' crosses '/', so this matches at any depth.
      glob: '*.rs'
      run: cargo fmt --all
      stage_fixed: true
    fmt-md:
      glob: '*.md'
      run: rumdl fmt {staged_files}
      stage_fixed: true
    fmt-data:
      glob: '*.{json,toml,yaml,yml}'
      run: dprint fmt --allow-no-files {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    conventional-commit:
      run: cog verify --ignore-merge-commits --ignore-fixup-commits --file {1}
    no-trek-in-subject:
      run: "! head -1 {1} | grep -qE '\\(TREK-[0-9]+' && echo 'ok' || (echo 'error: TREK-XX belongs in the commit footer, not the subject line' && exit 1)"

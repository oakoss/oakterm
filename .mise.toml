[tools]
rust = "stable"
lefthook = "2.1.10"
dprint = "0.56.0"
rumdl = "0.2.58"
"cargo:cocogitto" = "7"
"cargo:cargo-deny" = "0.19"

[tasks.fmt]
description = "Format all non-Rust files"
run = ["dprint fmt", "rumdl fmt ."]

[tasks."fmt:check"]
description = "Check formatting"
run = "dprint check"

[tasks.lint]
description = "Run all linters"
depends = ["lint:md"]

[tasks."lint:md"]
description = "Lint markdown files"
run = "rumdl check ."

[tasks."cargo:fmt"]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks."cargo:fmt:check"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks."cargo:clippy"]
description = "Run clippy lints"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."cargo:check"]
description = "Type-check Rust code"
run = "cargo check --workspace --all-targets"

[tasks."cargo:deny"]
description = "Check dependency advisories, licenses, bans, sources"
run = "cargo deny check"

[tasks."cargo:test"]
description = "Run Rust tests"
run = "cargo test --workspace"

[tasks."cargo:test:gpu"]
description = "Run GPU tests (requires GPU adapter)"
run = "cargo test -p oakterm-renderer --features gpu-tests"

[tasks."cargo:bench"]
description = "Run Rust benchmarks"
run = "cargo bench --workspace"

[tasks.test]
description = "Run all tests"
depends = ["cargo:test"]

[tasks.bench]
description = "Run all benchmarks"
depends = ["cargo:bench"]

[tasks.deny]
description = "Run cargo-deny dependency checks"
depends = ["cargo:deny"]

[tasks.check]
description = "Run all checks (format + lint + Rust)"
depends = [
  "fmt:check",
  "lint",
  "cargo:fmt:check",
  "cargo:clippy",
  "cargo:check",
]
